<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#123b70">
<title>Collège Le Pionnier — Gestion scolaire</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="brand-mark">LP</div>
    <h1>Collège Le Pionnier</h1>
    <p>Portail de gestion scolaire</p>
    <input id="loginUser" placeholder="Identifiant" value="admin">
    <input id="loginPass" type="password" placeholder="Mot de passe" value="pionnier">
    <button class="primary full" onclick="login()">Se connecter</button>
    <small>Démo : admin / pionnier</small>
  </div>
</div>

<div id="app" class="hidden">
<header class="topbar">
  <button class="menu-btn" onclick="toggleSidebar()">☰</button>
  <div class="top-brand"><span class="logo">LP</span><span>Collège Le Pionnier</span></div>
  <div class="top-actions">
    <button onclick="toggleTheme()" title="Changer de thème">◐</button>
    <button onclick="openModal('settingsModal')" title="Paramètres">⚙</button>
    <span class="admin-pill">Administrateur</span>
  </div>
</header>

<div class="layout">
<aside id="sidebar">
  <nav>
    <button class="nav-item active" data-page="dashboard" onclick="showPage('dashboard')">▦ <span>Tableau de bord</span></button>
    <button class="nav-item" data-page="students" onclick="showPage('students')">♙ <span>Élèves</span></button>
    <button class="nav-item" data-page="teachers" onclick="showPage('teachers')">♧ <span>Enseignants</span></button>
    <button class="nav-item" data-page="classes" onclick="showPage('classes')">▤ <span>Classes</span></button>
    <button class="nav-item" data-page="payments" onclick="showPage('payments')">▣ <span>Frais & paiements</span></button>
    <button class="nav-item" data-page="registrations" onclick="showPage('registrations')">✎ <span>Inscriptions</span></button>
    <button class="nav-item" data-page="grades" onclick="showPage('grades')">★ <span>Notes & résultats</span></button>
    <button class="nav-item" data-page="announcements" onclick="showPage('announcements')">◉ <span>Annonces</span></button>
    <button class="nav-item" data-page="public" onclick="showPage('public')">⌂ <span>Site public</span></button>
  </nav>
  <div class="side-bottom">
    <button class="nav-item" onclick="exportData()">⇩ <span>Exporter les données</span></button>
    <button class="nav-item" onclick="document.getElementById('importFile').click()">⇧ <span>Importer</span></button>
    <input id="importFile" type="file" accept=".json" hidden onchange="importData(event)">
    <button class="nav-item danger-text" onclick="logout()">↪ <span>Déconnexion</span></button>
  </div>
</aside>

<main id="main"></main>
</div>
</div>

<div id="toast"></div>

<div id="studentModal" class="modal"><div class="modal-card">
  <div class="modal-head"><h2 id="studentModalTitle">Ajouter un élève</h2><button onclick="closeModal('studentModal')">×</button></div>
  <div class="form-grid">
    <input id="sName" placeholder="Nom complet">
    <input id="sBirth" type="date" title="Date de naissance">
    <select id="sSex"><option value="">Sexe</option><option>Masculin</option><option>Féminin</option></select>
    <select id="sClass"></select>
    <input id="sParent" placeholder="Nom du responsable">
    <input id="sPhone" placeholder="Téléphone du responsable">
  </div>
  <button class="primary" onclick="saveStudent()">Enregistrer</button>
</div></div>

<div id="paymentModal" class="modal"><div class="modal-card">
  <div class="modal-head"><h2>Enregistrer un paiement</h2><button onclick="closeModal('paymentModal')">×</button></div>
  <div class="form-grid">
    <select id="pStudent"></select>
    <input id="pAmount" type="number" min="0" placeholder="Montant payé (FC)">
    <input id="pDate" type="date">
    <select id="pMethod"><option>Espèces</option><option>Mobile Money</option><option>Virement</option><option>Autre</option></select>
    <input id="pRef" placeholder="Référence / reçu">
  </div>
  <button class="primary" onclick="savePayment()">Valider le paiement</button>
</div></div>

<div id="registrationModal" class="modal"><div class="modal-card">
  <div class="modal-head"><h2>Nouvelle inscription</h2><button onclick="closeModal('registrationModal')">×</button></div>
  <div class="form-grid">
    <input id="rName" placeholder="Nom complet de l'élève">
    <input id="rBirth" type="date">
    <input id="rParent" placeholder="Responsable">
    <input id="rPhone" placeholder="Téléphone">
    <select id="rClass"></select>
    <select id="rOption"><option>Générale</option><option>GÉO-MINE</option><option>Laboratoire chimique</option><option>Laboratoire électrique</option><option>Commercial et gestion</option><option>Humanité pédagogique</option><option>Mécanique générale</option></select>
  </div>
  <button class="primary" onclick="saveRegistration()">Enregistrer l'inscription</button>
</div></div>

<div id="announcementModal" class="modal"><div class="modal-card">
  <div class="modal-head"><h2>Nouvelle annonce</h2><button onclick="closeModal('announcementModal')">×</button></div>
  <input id="aTitle" placeholder="Titre">
  <textarea id="aText" placeholder="Contenu de l'annonce"></textarea>
  <button class="primary" onclick="saveAnnouncement()">Publier</button>
</div></div>

<div id="settingsModal" class="modal"><div class="modal-card">
  <div class="modal-head"><h2>Paramètres</h2><button onclick="closeModal('settingsModal')">×</button></div>
  <label>Nom de l'établissement</label><input id="schoolName" value="Collège Le Pionnier">
  <label>Devise</label><input id="schoolCurrency" value="FC">
  <label>Frais scolaires annuels par défaut</label><input id="defaultFees" type="number" value="1200000">
  <button class="primary" onclick="saveSettings()">Sauvegarder</button>
</div></div>

<script src="app.js"></script>
</body>
</html>
